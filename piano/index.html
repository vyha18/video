<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Courier+Prime&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ivory: #f5f0e8;
    --ebony: #1a1008;
    --accent: #c8860a;
    --cream: #ede5d0;
    --shadow: #6b4c1e44;
    --glow: #ffd97066;
    --pressed-white: #e8dfc8;
    --pressed-black: #3d2a0f;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--ebony);
    font-family: 'Courier Prime', monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, #3d2a0f 0%, #1a1008 60%),
      repeating-linear-gradient(90deg, transparent, transparent 59px, #ffffff08 59px, #ffffff08 60px);
    min-height: 100dvh;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.4;
  }

  .piano-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 16px;
    width: 100%;
  }

  header {
    text-align: center;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    color: var(--accent);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-weight: 400;
  }

  header p {
    font-size: 0.65rem;
    color: #7a6040;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Octave selector */
  .octave-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #7a6040;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
  }

  .octave-bar button {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid #7a6040;
    background: transparent;
    color: var(--accent);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .octave-bar button:active { background: #3d2a0f; }

  #octave-label {
    font-family: 'Playfair Display', serif;
    color: var(--cream);
    font-size: 0.9rem;
    min-width: 60px;
    text-align: center;
  }

  /* Piano keyboard */
  .piano-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    width: 100%;
    max-width: 100vw;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .piano-scroll::-webkit-scrollbar { display: none; }

  .piano {
    position: relative;
    display: flex;
    align-items: flex-start;
    height: clamp(160px, 30vh, 240px);
    padding: 0 8px;
    width: max-content;
    margin: 0 auto;
  }

  /* White keys */
  .key-white {
    position: relative;
    width: clamp(42px, 8vw, 58px);
    height: 100%;
    background: linear-gradient(180deg, var(--ivory) 0%, var(--cream) 70%, #ddd5c0 100%);
    border: 1px solid #c8b89a;
    border-top: none;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.05s;
    box-shadow:
      inset 0 -4px 8px #00000018,
      2px 4px 8px #00000044;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  .key-white::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(180deg, #e8dfc8, transparent);
    border-radius: 0;
    pointer-events: none;
  }

  .key-white .key-label {
    font-size: clamp(0.5rem, 1.5vw, 0.65rem);
    color: #9a8060;
    letter-spacing: 0.05em;
    pointer-events: none;
    font-family: 'Playfair Display', serif;
  }

  .key-white.pressed,
  .key-white:active {
    background: linear-gradient(180deg, var(--pressed-white) 0%, #d4c9a8 100%);
    box-shadow:
      inset 0 4px 10px #00000030,
      1px 2px 4px #00000044;
    transform: scaleY(0.985);
    transform-origin: top;
  }

  /* Black keys */
  .key-black {
    position: absolute;
    width: clamp(26px, 4.8vw, 36px);
    height: 62%;
    background: linear-gradient(180deg, #2a1a08 0%, #1a1008 50%, #0d0804 100%);
    border: 1px solid #0a0604;
    border-top: 2px solid #3d2a0f;
    border-radius: 0 0 4px 4px;
    cursor: pointer;
    z-index: 2;
    transition: background 0.05s;
    box-shadow:
      2px 4px 8px #00000088,
      inset 0 -2px 4px #00000060;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
  }

  .key-black .key-label {
    font-size: clamp(0.4rem, 1.2vw, 0.55rem);
    color: #5a4020;
    letter-spacing: 0.05em;
    pointer-events: none;
    font-family: 'Playfair Display', serif;
  }

  .key-black.pressed,
  .key-black:active {
    background: linear-gradient(180deg, var(--pressed-black) 0%, #1a1008 100%);
    box-shadow:
      1px 2px 4px #00000088,
      inset 0 2px 6px #00000080;
    transform: scaleY(0.97);
    transform-origin: top;
  }

  /* Ripple on key press */
  @keyframes ripple {
    0% { transform: scale(0); opacity: 0.8; }
    100% { transform: scale(2.5); opacity: 0; }
  }
  .ripple-dot {
    position: absolute;
    bottom: 20%;
    left: 50%;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--glow);
    transform: translate(-50%, 50%) scale(0);
    pointer-events: none;
    animation: ripple 0.4s ease-out forwards;
  }

  /* Volume + sustain controls */
  .controls {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .control-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #7a6040;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 90px;
    height: 3px;
    background: #3d2a0f;
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .sustain-btn {
    width: 56px; height: 24px;
    border-radius: 12px;
    border: 1px solid #7a6040;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s;
  }
  .sustain-btn::after {
    content: '';
    position: absolute;
    left: 3px; top: 3px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #3d2a0f;
    transition: transform 0.2s, background 0.2s;
  }
  .sustain-btn.on {
    border-color: var(--accent);
  }
  .sustain-btn.on::after {
    transform: translateX(32px);
    background: var(--accent);
  }

  /* Keyboard hint */
  .hint {
    font-size: 0.6rem;
    color: #4a3820;
    letter-spacing: 0.15em;
    text-align: center;
    line-height: 1.8;
  }

  /* Visualizer bar */
  .visualizer {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 28px;
  }

  .vis-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    opacity: 0.3;
    transition: height 0.1s, opacity 0.1s;
    min-height: 2px;
  }
  .vis-bar.active {
    opacity: 1;
  }
</style>
</head>
<body>
<div class="piano-wrap">
  <header>
    <h1>Grand Piano</h1>
    <p>Touch to play</p>
  </header>

  <div class="visualizer" id="visualizer"></div>

  <div class="piano-scroll">
    <div class="piano" id="piano"></div>
  </div>

  <div class="octave-bar">
    <button id="oct-down">−</button>
    <span id="octave-label">Octave 4</span>
    <button id="oct-up">+</button>
  </div>

  <div class="controls">
    <div class="control-item">
      <span>Volume</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
    </div>
    <div class="control-item">
      <span>Reverb</span>
      <input type="range" id="reverb" min="0" max="1" step="0.01" value="0.3">
    </div>
    <div class="control-item">
      <span>Sustain</span>
      <button class="sustain-btn" id="sustain-btn"></button>
    </div>
  </div>

  <p class="hint">Tap keys to play · Keyboard: A S D F G H J K / W E T Y U</p>
</div>

<script>
// ── Audio Engine ──────────────────────────────────────────────
const AudioContext = window.AudioContext || window.webkitAudioContext;
let ctx = null;
let reverbNode = null;
let masterGain = null;
let reverbWet = 0.3;
let sustainOn = false;
let sustainedNotes = new Map(); // noteId → {gain, osc1, osc2}

function initAudio() {
  if (ctx) return;
  ctx = new AudioContext();

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.7;
  masterGain.connect(ctx.destination);

  // Convolver reverb (impulse response approximation)
  reverbNode = ctx.createConvolver();
  const rate = ctx.sampleRate;
  const length = rate * 2.5;
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.2);
    }
  }
  reverbNode.buffer = impulse;
  reverbNode.connect(masterGain);
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function playNote(midi, velocity = 0.8) {
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();

  const freq = midiToFreq(midi);
  const now = ctx.currentTime;
  const vol = parseFloat(document.getElementById('volume').value);
  const noteId = midi;

  // Release old sustained note if re-striking
  releaseSustainedNote(noteId, now);

  const env = ctx.createGain();
  env.gain.setValueAtTime(0, now);
  env.gain.linearRampToValueAtTime(velocity * vol * 0.5, now + 0.008);
  env.gain.exponentialRampToValueAtTime(velocity * vol * 0.18, now + 0.12);
  env.gain.setTargetAtTime(velocity * vol * 0.10, now + 0.12, 0.4);

  // Dry path
  env.connect(masterGain);
  // Wet reverb path
  const reverbGain = ctx.createGain();
  reverbGain.gain.value = reverbWet;
  env.connect(reverbGain);
  reverbGain.connect(reverbNode);

  // Piano-like timbre: fundamental + harmonics
  const oscs = [];
  const partials = [
    { mult: 1,   gain: 1.0 },
    { mult: 2,   gain: 0.35 },
    { mult: 3,   gain: 0.15 },
    { mult: 4,   gain: 0.08 },
    { mult: 6,   gain: 0.04 },
  ];

  for (const p of partials) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq * p.mult;
    const g = ctx.createGain();
    g.gain.value = p.gain;
    osc.connect(g);
    g.connect(env);
    osc.start(now);
    oscs.push({ osc, g });
  }

  // Attack click
  const click = ctx.createOscillator();
  const clickGain = ctx.createGain();
  click.type = 'square';
  click.frequency.value = freq * 8;
  clickGain.gain.setValueAtTime(0.08 * vol, now);
  clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
  click.connect(clickGain);
  clickGain.connect(masterGain);
  click.start(now);
  click.stop(now + 0.04);

  const noteData = { env, oscs, reverbGain, startTime: now };
  sustainedNotes.set(noteId, noteData);

  if (!sustainOn) {
    scheduleRelease(noteData, now + 0.05);
  }

  updateVisualizer();
}

function stopNote(midi) {
  if (!sustainOn) {
    const data = sustainedNotes.get(midi);
    if (data) {
      scheduleRelease(data, ctx.currentTime);
      sustainedNotes.delete(midi);
    }
  }
}

function scheduleRelease(data, releaseTime) {
  const { env, oscs, reverbGain } = data;
  const now = releaseTime;
  env.gain.cancelScheduledValues(now);
  const cur = env.gain.value;
  env.gain.setValueAtTime(Math.max(cur, 0.001), now);
  env.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
  oscs.forEach(({ osc }) => { try { osc.stop(now + 2); } catch(e){} });
}

function releaseSustainedNote(noteId, now) {
  const data = sustainedNotes.get(noteId);
  if (data) {
    scheduleRelease(data, now);
    sustainedNotes.delete(noteId);
  }
}

function releaseAllSustained() {
  const now = ctx ? ctx.currentTime : 0;
  sustainedNotes.forEach((data) => scheduleRelease(data, now));
  sustainedNotes.clear();
}

// ── Visualizer ────────────────────────────────────────────────
const VIS_COUNT = 20;
const visEl = document.getElementById('visualizer');
const visBars = [];
for (let i = 0; i < VIS_COUNT; i++) {
  const b = document.createElement('div');
  b.className = 'vis-bar';
  b.style.height = '2px';
  visEl.appendChild(b);
  visBars.push(b);
}

function updateVisualizer() {
  const active = sustainedNotes.size;
  visBars.forEach((b, i) => {
    if (i < active * 2 + Math.random() * 4) {
      b.style.height = (4 + Math.random() * 22) + 'px';
      b.classList.add('active');
    } else {
      b.style.height = '2px';
      b.classList.remove('active');
    }
  });
  if (active > 0) setTimeout(updateVisualizer, 80);
  else visBars.forEach(b => { b.style.height = '2px'; b.classList.remove('active'); });
}

// ── Piano Layout ──────────────────────────────────────────────
// Build 2 octaves centred on chosen octave
let baseOctave = 4; // C4 = midi 60

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WHITE_NOTES = [0,2,4,5,7,9,11]; // semitones
const BLACK_NOTES = [1,3,6,8,10];
const BLACK_OFFSETS = { 1: 0.6, 3: 1.6, 6: 3.6, 8: 4.6, 10: 5.6 };

const KB_MAP = {
  'a': 0,  'w': 1,  's': 2,  'e': 3,  'd': 4,
  'f': 5,  't': 6,  'g': 7,  'y': 8,  'h': 9,
  'u': 10, 'j': 11, 'k': 12, 'o': 13, 'l': 14,
  'p': 15
};

let pianoEl = document.getElementById('piano');
let keyElements = {}; // midi → element

function buildPiano() {
  pianoEl.innerHTML = '';
  keyElements = {};

  const octaves = 2;
  const startMidi = (baseOctave) * 12 + 12; // C of baseOctave

  // Build white keys first as flex row
  const whites = [];
  for (let oct = 0; oct < octaves; oct++) {
    for (const semi of WHITE_NOTES) {
      const midi = startMidi + oct * 12 + semi;
      whites.push(midi);
    }
  }

  // White key container approach: position blacks absolutely within piano
  const whiteW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--white-w') || '52');

  whites.forEach((midi, idx) => {
    const el = document.createElement('div');
    el.className = 'key-white';
    const name = NOTE_NAMES[midi % 12];
    el.innerHTML = `<span class="key-label">${name}${Math.floor(midi/12)-1}</span>`;
    attachKeyEvents(el, midi);
    pianoEl.appendChild(el);
    keyElements[midi] = el;
  });

  // Now black keys
  for (let oct = 0; oct < octaves; oct++) {
    for (const semi of BLACK_NOTES) {
      const midi = startMidi + oct * 12 + semi;
      const el = document.createElement('div');
      el.className = 'key-black';
      const name = NOTE_NAMES[midi % 12];
      el.innerHTML = `<span class="key-label">${name}</span>`;

      // Calculate left offset
      const whiteKeyWidth = pianoEl.querySelector('.key-white').getBoundingClientRect().width || 52;
      const baseOffset = BLACK_OFFSETS[semi];
      const octOffset = oct * 7;
      el.style.left = `${(baseOffset + octOffset) * whiteKeyWidth + 8}px`;

      attachKeyEvents(el, midi);
      pianoEl.appendChild(el);
      keyElements[midi] = el;
    }
  }
}

function attachKeyEvents(el, midi) {
  // Touch
  el.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    pressKey(midi, el);
  }, { passive: false });

  el.addEventListener('touchend', (e) => {
    e.preventDefault();
    releaseKey(midi, el);
  }, { passive: false });

  // Mouse
  el.addEventListener('mousedown', (e) => {
    e.preventDefault();
    initAudio();
    pressKey(midi, el);
  });
  el.addEventListener('mouseup', () => releaseKey(midi, el));
  el.addEventListener('mouseleave', () => releaseKey(midi, el));
}

function pressKey(midi, el) {
  el.classList.add('pressed');
  // Ripple
  const rip = document.createElement('div');
  rip.className = 'ripple-dot';
  el.appendChild(rip);
  setTimeout(() => rip.remove(), 450);
  playNote(midi);
}

function releaseKey(midi, el) {
  el.classList.remove('pressed');
  stopNote(midi);
}

// Build after a tiny delay so layout is ready for offset calculations
buildPiano();
setTimeout(() => {
  // Reposition black keys after layout
  const whiteKeys = pianoEl.querySelectorAll('.key-white');
  if (whiteKeys.length === 0) return;
  const ww = whiteKeys[0].getBoundingClientRect().width;
  if (ww === 0) return;

  const startMidi = baseOctave * 12 + 12;
  const octaves = 2;
  for (let oct = 0; oct < octaves; oct++) {
    for (const semi of BLACK_NOTES) {
      const midi = startMidi + oct * 12 + semi;
      const el = keyElements[midi];
      if (!el) continue;
      const baseOffset = BLACK_OFFSETS[semi];
      const octOffset = oct * 7;
      el.style.left = `${(baseOffset + octOffset) * ww + 8}px`;
    }
  }
}, 60);

// ── Octave control ────────────────────────────────────────────
document.getElementById('oct-up').addEventListener('click', () => {
  if (baseOctave < 6) { baseOctave++; refreshPiano(); }
});
document.getElementById('oct-down').addEventListener('click', () => {
  if (baseOctave > 1) { baseOctave--; refreshPiano(); }
});

function refreshPiano() {
  document.getElementById('octave-label').textContent = `Octave ${baseOctave}`;
  buildPiano();
  setTimeout(() => {
    const whiteKeys = pianoEl.querySelectorAll('.key-white');
    if (!whiteKeys.length) return;
    const ww = whiteKeys[0].getBoundingClientRect().width;
    if (!ww) return;
    const startMidi = baseOctave * 12 + 12;
    for (let oct = 0; oct < 2; oct++) {
      for (const semi of BLACK_NOTES) {
        const midi = startMidi + oct * 12 + semi;
        const el = keyElements[midi];
        if (el) el.style.left = `${(BLACK_OFFSETS[semi] + oct * 7) * ww + 8}px`;
      }
    }
  }, 60);
}

// ── Volume / Reverb ───────────────────────────────────────────
document.getElementById('volume').addEventListener('input', function() {
  if (masterGain) masterGain.gain.value = parseFloat(this.value);
});
document.getElementById('reverb').addEventListener('input', function() {
  reverbWet = parseFloat(this.value);
});

// ── Sustain ───────────────────────────────────────────────────
const sustainBtn = document.getElementById('sustain-btn');
sustainBtn.addEventListener('click', () => {
  sustainOn = !sustainOn;
  sustainBtn.classList.toggle('on', sustainOn);
  if (!sustainOn) releaseAllSustained();
});

// ── Keyboard input ────────────────────────────────────────────
const pressedKeys = new Set();
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const key = e.key.toLowerCase();
  if (key in KB_MAP) {
    initAudio();
    const startMidi = baseOctave * 12 + 12;
    const midi = startMidi + KB_MAP[key];
    pressedKeys.add(key);
    const el = keyElements[midi];
    if (el) pressKey(midi, el);
  }
  if (e.key === ' ') {
    e.preventDefault();
    sustainOn = !sustainOn;
    sustainBtn.classList.toggle('on', sustainOn);
    if (!sustainOn) releaseAllSustained();
  }
});
document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (key in KB_MAP) {
    pressedKeys.delete(key);
    const startMidi = baseOctave * 12 + 12;
    const midi = startMidi + KB_MAP[key];
    const el = keyElements[midi];
    if (el) releaseKey(midi, el);
  }
});
</script>
</body>
</html>
