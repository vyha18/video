<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Say an Animal 🐾 → Frame Shows Image</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #0b1220;
      color: #e7ecf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header { margin-bottom: 20px; text-align: center; }
    .controls { margin-top: 10px; }
    .btn {
      padding: 10px 16px;
      margin-right: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .frame {
      width: 250px;
      height: 250px;
      background: #0f182a;
      border: 3px solid #e7ecf3;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      animation: jumpOut 0.6s ease forwards;
    }
    @keyframes jumpOut {
      0% { transform: scale(0.5) translateY(60px); opacity: 0; }
      50% { transform: scale(1.2) translateY(-20px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 900px;
    }
    .tile {
      background: #0f182a;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .tile:hover { transform: scale(1.05); }
    .tile img {
      max-width: 100%;
      height: 80px;
      object-fit: contain;
    }
    .tile strong { display: block; margin-top: 6px; }

    .transcript { margin: 12px 0; color: #9fb0c6; }
    .status { margin: 10px 0; color: #9fb0c6; }
  </style>
</head>
<body>
  <header>
    <h1>🐾 Say or Click an animal → See it in the frame</h1>
    <div class="controls">
      <button id="startBtn" class="btn">Start Listening</button>
      <button id="stopBtn" class="btn" disabled>Stop</button>
      <input id="textInput" placeholder="…or type an animal here" class="btn" style="padding:10px; min-width: 180px;" />
      <button id="showBtn" class="btn">Show</button>
    </div>
  </header>

  <div class="frame" id="frame"></div>
  <div id="transcript" class="transcript"></div>
  <div id="status" class="status">Ready.</div>

  <div class="grid" id="grid"></div>

  <script>
    const animals = {
      cat: 'cat.png',
      dog: 'dog.png',
      pig: 'pig.jpg',
      snake: 'snake.png',
      dino: 'dino.png',
      crocodile: 'crocodile.png',
      bat: 'bat.png',
      horse: 'horse.png',
      duck: 'duck.png',
      chicken: 'chicken.png',
      shark: 'shark.png',
      monkey: 'monkey.png',
      fish: 'fish.png',
      cow: 'cow.png',
      elephant: 'elephant.png',
      bear: 'bear.png',
      bee: 'bee.png',
      bunny: 'bunny.png',
      mouse: 'mouse.jpg',
      rhino: 'rhino.jpg'
    };

    const aliases = {
      cats: 'cat',
      doggy: 'dog', dogs: 'dog',
      pigs: 'pig',
      snakes: 'snake',
      dinosaurs: 'dino', dinosaur: 'dino',
      croc: 'crocodile',
      rabbits: 'bunny', rabbit: 'bunny',
      mice: 'mouse',
      rhinos: 'rhino'
    };

    const grid = document.getElementById('grid');
    const frame = document.getElementById('frame');
    const transcriptEl = document.getElementById('transcript');
    const statusEl = document.getElementById('status');

    function normalize(word) {
      if (!word) return '';
      const cleaned = word.toLowerCase().replace(/[^a-z]/g, '');
      return aliases[cleaned] || cleaned;
    }

    function findAnimalIn(text) {
      const words = String(text || '').toLowerCase().split(/\s+/).map(w => normalize(w));
      for (const w of words) {
        if (animals[w]) return w;
      }
      return null;
    }

    function showInFrame(key) {
      if (animals[key]) {
        frame.innerHTML = `<img src="${animals[key]}" alt="${key}" />`;
        statusEl.textContent = `Showing: ${key}`;
      } else {
        statusEl.textContent = `No match found.`;
      }
    }

    // build grid and add click listeners
    Object.entries(animals).forEach(([key, src]) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML = `<img src="${src}" alt="${key}"/><strong>${key}</strong>`;
      tile.addEventListener('click', () => showInFrame(key));
      grid.appendChild(tile);
    });

    document.getElementById('showBtn').addEventListener('click', () => {
      const key = normalize(document.getElementById('textInput').value.trim());
      if (key) showInFrame(key);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript + ' ';
        }
        transcriptEl.textContent = transcript.trim();
        const guess = findAnimalIn(transcript);
        if (guess) showInFrame(guess);
      };

      document.getElementById('startBtn').addEventListener('click', () => {
        recognition.start();
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        statusEl.textContent = 'Listening…';
      });
      document.getElementById('stopBtn').addEventListener('click', () => {
        recognition.stop();
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        statusEl.textContent = 'Stopped.';
      });
    } else {
      statusEl.textContent = 'Speech recognition not supported in this browser.';
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = true;
    }
  </script>
</body>
</html>
