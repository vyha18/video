<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Patatap-like — Single-file clone</title>
  <style>
    :root{--bg:#0b0f1a;--panel:rgba(255,255,255,0.04);--muted:rgba(255,255,255,0.12)}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial}
    body{background:linear-gradient(180deg,#071223 0%,#0b0f1a 100%);color:#fff;overflow:hidden}
    canvas{display:block;width:100vw;height:100vh}
    .ui{
      position:fixed;left:12px;top:12px;z-index:20;backdrop-filter:blur(6px);
      background:var(--panel);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center
    }
    .btn{background:transparent;border:1px solid var(--muted);padding:6px 10px;border-radius:8px;color:#fff;cursor:pointer}
    .kbd-grid{position:fixed;left:12px;bottom:12px;z-index:20;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
    .pad{min-width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(255,255,255,0.06);font-weight:600;user-select:none}
    .pad:active{transform:scale(0.98)}
    .label{font-size:12px;opacity:0.85}
    @media (max-width:600px){.pad{min-width:40px;height:40px}}
  </style>
</head>
<body>
  <div class="ui">
    <button id="mute" class="btn">Mute</button>
    <button id="clear" class="btn">Clear visuals</button>
    <div style="font-size:12px;opacity:0.9;padding-left:6px">Press keys A–Z or tap pads</div>
  </div>

  <div id="pads" class="kbd-grid"></div>
  <canvas id="c"></canvas>

<script>
// Patatap-like single-file clone (no external assets)
// Author: Generated by ChatGPT — uses WebAudio + canvas particles + per-key mapping

const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const keyToIndex = {};
LETTERS.forEach((k,i)=>keyToIndex[k]=i);

// UI: build pads
const pads = document.getElementById('pads');
for(let i=0;i<LETTERS.length;i++){
  const d = document.createElement('div');
  d.className='pad';
  d.dataset.key = LETTERS[i];
  d.innerHTML = `<div style="text-align:center"><div style="font-size:14px">${LETTERS[i]}</div><div class="label">${i+1}</div></div>`;
  pads.appendChild(d);
}

// Audio setup
const AudioContext = window.AudioContext || window.webkitAudioContext;
const ac = new AudioContext();
let masterGain = ac.createGain(); masterGain.gain.value = 0.9; masterGain.connect(ac.destination);

function freqFromIndex(i){
  // spread across a musical range (C3 - C6 approx)
  const min = 130.81; // C3
  const max = 1046.5; // C6
  const t = i / (LETTERS.length - 1);
  return min * Math.pow(max/min, t);
}

function playSoundForIndex(i){
  if(!ac) return;
  const now = ac.currentTime;
  const carrier = ac.createOscillator();
  const mod = ac.createOscillator();
  const modGain = ac.createGain();
  const gain = ac.createGain();
  const filter = ac.createBiquadFilter();

  // timbre selection per index (sine/saw/triangle) to emulate varied sounds
  const types = ['sine','sawtooth','triangle','square'];
  carrier.type = types[i % types.length];
  carrier.frequency.value = freqFromIndex(i);

  // subtle FM-ish effect
  mod.type = (i % 3 === 0) ? 'sine' : 'triangle';
  mod.frequency.value = 0.5 + (i % 7) * 0.7;
  modGain.gain.value = 20 + (i % 5) * 40;

  // filter
  filter.type = 'lowpass';
  filter.frequency.value = 800 + (i % 12) * 300;
  filter.Q.value = 6 - (i%6)*0.7;

  // envelope
  gain.gain.value = 0.0001;
  gain.connect(filter);
  filter.connect(masterGain);

  carrier.connect(gain);
  mod.connect(modGain);
  modGain.connect(carrier.frequency);

  // minor distortion via waveshaper (optional subtlety)
  // start
  carrier.start(now);
  mod.start(now);

  // envelope schedule
  const attack = 0.002 + (i%5)*0.02;
  const decay = 0.1 + (i%4)*0.05;
  const sustain = 0.05 + (i%3)*0.03;
  gain.gain.cancelScheduledValues(now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(1.0, now + attack);
  gain.gain.exponentialRampToValueAtTime(sustain, now + attack + decay);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay + 1.4);

  // stop after safe duration
  carrier.stop(now + attack + decay + 1.6);
  mod.stop(now + attack + decay + 1.6);
}

// visuals
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=canvas.width=innerWidth, H=canvas.height=innerHeight;
window.addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight});

const particles = [];
function randomColor(i){
  // deterministic-ish color per key index
  const hue = Math.floor((i * 47) % 360);
  return `hsl(${hue} 85% 60%)`;
}

function spawnVisual(i,x=null,y=null){
  const cx = x===null ? Math.random()*W : x;
  const cy = y===null ? Math.random()*H : y;
  const hue = randomColor(i);
  const count = 12 + (i%7)*4;
  for(let c=0;c<count;c++){
    particles.push({
      x:cx, y:cy,
      vx:(Math.random()-0.5)*(2 + c*0.2),
      vy:(Math.random()-0.5)*(2 + c*0.2),
      r:6 + Math.random()*28,
      life:1, decay:0.012 + Math.random()*0.02,
      hue, rot:Math.random()*Math.PI*2
    });
  }
}

function animate(){
  ctx.clearRect(0,0,W,H);
  // subtle background fade for motion trails
  ctx.fillStyle='rgba(6,8,15,0.18)';
  ctx.fillRect(0,0,W,H);

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.v *= 0.999;
    p.life -= p.decay;
    if(p.life<=0 || p.r<=0.4) { particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    // radial gradient
    const g = ctx.createRadialGradient(0,0,p.r*0.1,0,0,p.r);
    g.addColorStop(0,'rgba(255,255,255,0.9)');
    g.addColorStop(0.2,p.hue.replace('hsl','hsl').replace(')',',0.85)'))
  }
}

// Oops: above I accidentally inserted a broken line when building gradient.
// I'll rewrite animate to be correct.

function animate(){
  ctx.fillStyle='rgba(6,8,15,0.18)';
  ctx.fillRect(0,0,W,H);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.rot += 0.02;
    p.life -= p.decay; p.r *= 0.997;
    if(p.life<=0 || p.r<=0.4){ particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    const g = ctx.createRadialGradient(0,0,p.r*0.05,0,0,p.r);
    // parse hue number from "hsl(X 85% 60%)"
    const hueMatch = p.hue.match(/hsl\((\d+)/);
    const hueNum = hueMatch ? hueMatch[1] : 200;
    g.addColorStop(0, `hsla(${hueNum},100%,95%,1)`);
    g.addColorStop(0.2, `hsla(${hueNum},85%,60%,0.9)`);
    g.addColorStop(1, `hsla(${hueNum},85%,45%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// input handling
let isMuted=false;
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click',()=>{isMuted=!isMuted; masterGain.gain.value = isMuted ? 0 : 0.9; muteBtn.textContent = isMuted ? 'Unmute' : 'Mute'});

document.getElementById('clear').addEventListener('click',()=>{particles.length=0; ctx.clearRect(0,0,W,H)});

function triggerKey(letter, clientX=null, clientY=null){
  const i = keyToIndex[letter.toUpperCase()];
  if(i===undefined) return;
  // resume audio context if needed (autoplay policy)
  if(ac.state === 'suspended') ac.resume();
  try{ playSoundForIndex(i); }catch(e){console.warn(e)}
  spawnVisual(i, clientX, clientY);
  // pulse pad
  const pad = Array.from(document.querySelectorAll('.pad')).find(p=>p.dataset.key===letter.toUpperCase());
  if(pad){ pad.animate([{transform:'scale(1.0)'},{transform:'scale(0.94)'},{transform:'scale(1.0)'}],{duration:220}); }
}

window.addEventListener('keydown', (e)=>{
  if(e.repeat) return; const k = e.key.toUpperCase(); if(keyToIndex[k]!==undefined){ triggerKey(k); }
});

// pointer/touch support
pads.addEventListener('pointerdown',(ev)=>{
  const el = ev.target.closest('.pad'); if(!el) return; const key = el.dataset.key; triggerKey(key, ev.clientX, ev.clientY);
});

// also allow clicking anywhere to spawn interesting visuals + sound mapped to random key
canvas.addEventListener('pointerdown', (ev)=>{ const i=Math.floor(Math.random()*LETTERS.length); triggerKey(LETTERS[i], ev.clientX, ev.clientY); });

// make pads accessible via touch doubles etc

// small polish: focus handling
window.addEventListener('blur',()=>{/* could pause visuals/audio */});

// friendly hint to enable audio on mobile: tap a pad or press a key

</script>
</body>
</html>
