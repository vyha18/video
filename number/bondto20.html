<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Bonds to 20</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        
        body {
            background-color: #f0f9ff;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        
        .description {
            text-align: center;
            margin-bottom: 25px;
            color: #34495e;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .section {
            margin-bottom: 40px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .section-title {
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.5rem;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        
        .bond-button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .bond-button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
        
        .bond-button.active {
            background-color: #e74c3c;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        
        .visualization {
            margin: 0 auto 25px;
            width: 500px;
            border: 2px solid #2c3e50;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .row {
            display: flex;
            height: 40px;
            margin-bottom: 5px;
        }
        
        .square {
            flex: 1;
            height: 100%;
            margin-right: 2px;
            transition: background-color 0.3s;
        }
        
        .row .square:last-child {
            margin-right: 0;
        }
        
        .blue {
            background-color: #3498db;
        }
        
        .red {
            background-color: #e74c3c;
        }
        
        .explanation {
            font-size: 1.3rem;
            text-align: center;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 8px;
            color: #2c3e50;
        }
        
        .highlight {
            color: #e74c3c;
            font-weight: bold;
        }
        
        @media (max-width: 600px) {
            .visualization {
                width: 90%;
            }
            
            .bond-button {
                padding: 6px 8px;
                font-size: 0.9rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <h1>Number Bonds to 20</h1>
    
    <div class="description">
        <p>Click on the buttons below to see how numbers bond to make 20.</p>
        <p>Blue squares show the first number, red squares show the second number.</p>
    </div>
    
    <!-- Addition Section -->
    <div class="section" id="addition-section">
        <h2 class="section-title">Addition</h2>
        
        <div class="controls" id="addition-controls">
            <!-- Addition buttons will be generated by JavaScript -->
        </div>
        
        <div class="visualization">
            <div class="row" id="addition-row1"></div>
            <div class="row" id="addition-row2"></div>
        </div>
        
        <div class="explanation" id="addition-explanation">
            Click a button to see a number bond!
        </div>
    </div>
    
    <!-- Subtraction Section -->
    <div class="section" id="subtraction-section">
        <h2 class="section-title">Subtraction</h2>
        
        <div class="controls" id="subtraction-controls">
            <!-- Subtraction buttons will be generated by JavaScript -->
        </div>
        
        <div class="visualization">
            <div class="row" id="subtraction-row1"></div>
            <div class="row" id="subtraction-row2"></div>
        </div>
        
        <div class="explanation" id="subtraction-explanation">
            Click a button to see a number bond!
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize both sections
            initializeSection('addition', true);
            initializeSection('subtraction', false);
            
            function initializeSection(sectionType, isAddition) {
                const controls = document.getElementById(`${sectionType}-controls`);
                const row1 = document.getElementById(`${sectionType}-row1`);
                const row2 = document.getElementById(`${sectionType}-row2`);
                const explanation = document.getElementById(`${sectionType}-explanation`);
                
                // Create the squares (10 in each row)
                for (let i = 0; i < 10; i++) {
                    const square1 = document.createElement('div');
                    square1.className = 'square';
                    square1.id = `${sectionType}-square1-${i+1}`;
                    row1.appendChild(square1);
                    
                    const square2 = document.createElement('div');
                    square2.className = 'square';
                    square2.id = `${sectionType}-square2-${i+1}`;
                    row2.appendChild(square2);
                }
                
                // Create the buttons for number bonds
                for (let i = 1; i <= 19; i++) {
                    const button = document.createElement('button');
                    button.className = 'bond-button';
                    
                    if (isAddition) {
                        button.textContent = `${i} + ${20-i} = 20`;
                        button.dataset.first = i;
                        button.dataset.second = 20 - i;
                    } else {
                        button.textContent = `20 - ${i} = ${20-i}`;
                        button.dataset.first = i;
                        button.dataset.second = 20 - i;
                    }
                    
                    button.addEventListener('click', function() {
                        // Remove active class from all buttons in this section
                        document.querySelectorAll(`#${sectionType}-controls .bond-button`).forEach(btn => {
                            btn.classList.remove('active');
                        });
                        
                        // Add active class to clicked button
                        this.classList.add('active');
                        
                        // Update visualization
                        updateVisualization(sectionType, parseInt(this.dataset.first), parseInt(this.dataset.second), isAddition);
                        
                        // Update explanation
                        if (isAddition) {
                            explanation.innerHTML = `There are <span class="highlight">${this.dataset.first}</span> blue squares and <span class="highlight">${this.dataset.second}</span> red squares.`;
                        } else {
                            explanation.innerHTML = `There are <span class="highlight">${this.dataset.second}</span> blue squares and <span class="highlight">${this.dataset.first}</span> red squares.`;
                        }
                    });
                    
                    controls.appendChild(button);
                }
                
                // Function to update the visualization
                function updateVisualization(sectionType, first, second, isAddition) {
                    // Reset all squares to default in this section
                    document.querySelectorAll(`#${sectionType}-row1 .square, #${sectionType}-row2 .square`).forEach(square => {
                        square.className = 'square';
                    });
                    
                    // For addition, first is blue, second is red
                    // For subtraction, first is red, second is blue
                    let blueCount, redCount;
                    
                    if (isAddition) {
                        blueCount = first;
                        redCount = second;
                    } else {
                        blueCount = second;
                        redCount = first;
                    }
                    
                    // Color the squares in row 1
                    for (let i = 1; i <= 10; i++) {
                        const square = document.getElementById(`${sectionType}-square1-${i}`);
                        if (i <= blueCount) {
                            square.classList.add('blue');
                        } else {
                            square.classList.add('red');
                        }
                    }
                    
                    // Color the squares in row 2
                    if (blueCount > 10) {
                        // If blue count is more than 10, we need to use both rows
                        const remainingBlue = blueCount - 10;
                        
                        for (let i = 1; i <= 10; i++) {
                            const square = document.getElementById(`${sectionType}-square2-${i}`);
                            if (i <= remainingBlue) {
                                square.classList.add('blue');
                            } else {
                                square.classList.add('red');
                            }
                        }
                    } else {
                        // If blue count is 10 or less, only row 1 has blue squares
                        for (let i = 1; i <= 10; i++) {
                            const square = document.getElementById(`${sectionType}-square2-${i}`);
                            square.classList.add('red');
                        }
                    }
                }
                
                // Initialize with 10+10 for addition or 20-10 for subtraction
                if (isAddition) {
                    document.querySelector(`#${sectionType}-controls .bond-button:nth-child(10)`).click();
                } else {
                    document.querySelector(`#${sectionType}-controls .bond-button:nth-child(10)`).click();
                }
            }
        });
    </script>
</body>
</html>
