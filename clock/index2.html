<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn to Tell Time</title>

<style>
body{
    margin:0;
    background:#eef5ff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
    user-select:none;
    touch-action:none;
}

h2{
    margin-bottom:15px;
}

#clock{
    background:white;
    border:10px solid #333;
    border-radius:50%;
    box-shadow:0 0 20px rgba(0,0,0,.25);
}

#time{
    margin-top:25px;
    font-size:36px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Move the Hands to Show the Time</h2>

<canvas id="clock" width="700" height="700"></canvas>

<div id="time"></div>

<script>

const canvas=document.getElementById("clock");
const ctx=canvas.getContext("2d");

const cx=350;
const cy=350;
const radius=320;

let minuteAngle=0;      //0 = 12 o'clock
let hourAngle=0;

let dragging=null;

draw();

canvas.addEventListener("mousedown",startDrag);
canvas.addEventListener("mousemove",drag);
window.addEventListener("mouseup",()=>dragging=null);

canvas.addEventListener("touchstart",startDrag,{passive:false});
canvas.addEventListener("touchmove",drag,{passive:false});
window.addEventListener("touchend",()=>dragging=null);

function pointerPos(e){

    let rect=canvas.getBoundingClientRect();

    let clientX,clientY;

    if(e.touches){
        clientX=e.touches[0].clientX;
        clientY=e.touches[0].clientY;
    }else{
        clientX=e.clientX;
        clientY=e.clientY;
    }

    return{
        x:(clientX-rect.left)*(canvas.width/rect.width),
        y:(clientY-rect.top)*(canvas.height/rect.height)
    };
}

function getAngle(x,y){

    let angle=Math.atan2(y-cy,x-cx);

    angle+=Math.PI/2;

    if(angle<0) angle+=Math.PI*2;

    return angle;
}

function handEnd(length,angle){

    return{
        x:cx+length*Math.sin(angle),
        y:cy-length*Math.cos(angle)
    };

}

function dist(a,b){

    return Math.hypot(a.x-b.x,a.y-b.y);

}

function startDrag(e){

    e.preventDefault();

    const p=pointerPos(e);

    let minEnd=handEnd(radius*0.85,minuteAngle);
    let hrEnd=handEnd(radius*0.55,hourAngle);

    if(dist(p,minEnd)<35){
        dragging="minute";
    }else if(dist(p,hrEnd)<35){
        dragging="hour";
    }
}

function drag(e){

    if(!dragging) return;

    e.preventDefault();

    let p=pointerPos(e);

    let ang=getAngle(p.x,p.y);

    if(dragging=="minute"){
        minuteAngle=ang;
    }else{
        hourAngle=ang;
    }

    draw();
}

function draw(){

    ctx.clearRect(0,0,700,700);

    //face
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();

    //ticks

    for(let i=0;i<60;i++){

        let angle=i*Math.PI/30;

        let outer=radius-5;

        let inner;

        let width;

        if(i%5==0){

            inner=radius-30;
            width=5;

        }else{

            inner=radius-15;
            width=2;

        }

        let x1=cx+inner*Math.sin(angle);
        let y1=cy-inner*Math.cos(angle);

        let x2=cx+outer*Math.sin(angle);
        let y2=cy-outer*Math.cos(angle);

        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.lineWidth=width;
        ctx.strokeStyle="#333";
        ctx.stroke();
    }

    //numbers

    ctx.font="42px Arial";
    ctx.fillStyle="#000";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(let n=1;n<=12;n++){

        let angle=n*Math.PI/6;

        let r=radius-60;

        let x=cx+r*Math.sin(angle);
        let y=cy-r*Math.cos(angle);

        ctx.fillText(n,x,y);

    }

    //hour hand

    drawHand(radius*0.55,hourAngle,10,"#0066cc");

    //minute hand

    drawHand(radius*0.85,minuteAngle,6,"#dd2222");

    //center

    ctx.beginPath();
    ctx.arc(cx,cy,12,0,Math.PI*2);
    ctx.fillStyle="#000";
    ctx.fill();

    updateTime();
}

function drawHand(length,angle,width,color){

    let x=cx+length*Math.sin(angle);
    let y=cy-length*Math.cos(angle);

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(x,y);
    ctx.lineWidth=width;
    ctx.lineCap="round";
    ctx.strokeStyle=color;
    ctx.stroke();

}

function updateTime(){

    let minute=Math.round(minuteAngle/(Math.PI*2)*60)%60;

    let hour=(hourAngle/(Math.PI*2))*12;

    let displayHour=Math.floor(hour);

    displayHour=((displayHour+11)%12)+1;

    document.getElementById("time").textContent=
        displayHour.toString().padStart(2,"0")+
        ":"+
        minute.toString().padStart(2,"0");

}

</script>

</body>
</html>
